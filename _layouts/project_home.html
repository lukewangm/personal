---
layout: default
---
<header><script src="/lib/d3.v3.min.js"></script></header>
<div class="home">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

  {{ content }}

  {%- if site.projects.size > 0 -%}
  <p class="button-container">
    <button onclick=fun() id="fun-btn" class="fun-button"> Click me? </button>
    <button onclick=arrangeNodes() id="arrange-btn" class="fun-button" style="display:none;"> Arrange </button>
  </p>
  
  <div id="fun-canvas-container">
    
  </div>
  
  <script type="application/json" id="projects-data">
    [
      {%- for project in site.projects -%}
      {
        "name": "{{ project.title | escape }}",
        "url": "{%- if project.redirect_to -%}{{ project.redirect_to }}{%- else -%}{{ project.url | relative_url }}{%- endif -%}"
      }{%- unless forloop.last -%},{%- endunless -%}
      {%- endfor -%}
    ]
  </script>
  <div id="basic-container">
    <ul class="post-list">
      {%- for post in site.projects -%}
      <li class="project-card">
        <h2>
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h2>
        {%- if site.show_excerpts -%}
          {{ post.excerpt }}
        {%- endif -%}
      </li>
      {%- endfor -%}
    </ul>
  </div>
    

  {%- endif -%}

</div>
<footer>
  <script src="/js/fun.js"></script>
</footer>
